<!DOCTYPE html>
<html>
<head>
    <title>IMDB Link Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        .movie { margin: 20px 0; padding: 20px; border: 1px solid #444; background: #2a2a2a; }
        .imdb-link { color: #fbbf24; text-decoration: none; font-weight: bold; }
        .imdb-link:hover { color: #f59e0b; }
    </style>
</head>
<body>
    <h1>IMDB Links Test</h1>
    <div id="movies"></div>

    <script>
        async function loadMovies() {
            try {
                const response = await fetch('http://localhost:5000/api/movies');
                const movies = await response.json();

                const container = document.getElementById('movies');
                container.innerHTML = movies.slice(0, 6).map(movie => `
                    <div class="movie">
                        <h3>${movie.title} (${movie.year})</h3>
                        <p>${movie.description}</p>
                        ${movie.imdb ?
                            `<a href="${movie.imdb}" target="_blank" class="imdb-link">📽️ View on IMDB</a>` :
                            '<span style="color: #666;">No IMDB link available</span>'
                        }
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading movies:', error);
            }
        }

        loadMovies();
    </script>
</body>
</html>
