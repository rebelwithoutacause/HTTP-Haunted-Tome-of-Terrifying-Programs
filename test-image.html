<!DOCTYPE html>
<html>
<head>
    <title>Poster Test</title>
</head>
<body>
    <h1>Testing Movie Posters</h1>

    <h2>Direct Image Test:</h2>
    <img src="http://localhost:5000/posters/The_Exorcist.jpg" style="width: 200px; height: 300px; object-fit: cover;" alt="The Exorcist">

    <h2>Test with HTML:</h2>
    <div style="width: 200px; height: 300px; border: 1px solid red;">
        <img src="http://localhost:5000/posters/Hereditary.jpg" style="width: 100%; height: 100%; object-fit: cover;" alt="Hereditary">
    </div>

    <script>
        // Test if images are loading
        const img = new Image();
        img.onload = () => console.log('Image loaded successfully');
        img.onerror = () => console.log('Image failed to load');
        img.src = 'http://localhost:5000/posters/The_Exorcist.jpg';
    </script>
</body>
</html>
